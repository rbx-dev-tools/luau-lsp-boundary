name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: luau-lsp-boundary.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: luau-lsp-boundary
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: luau-lsp-boundary
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: luau-lsp-boundary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo build --release --target ${{ matrix.target }}

      # The archive name carries the OS and architecture tokens rokit parses to
      # pick the right asset for the machine doing the install.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary }} `
            -DestinationPath luau-lsp-boundary-${{ github.ref_name }}-${{ matrix.target }}.zip
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          zip -j "$GITHUB_WORKSPACE/luau-lsp-boundary-${{ github.ref_name }}-${{ matrix.target }}.zip" ${{ matrix.binary }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: luau-lsp-boundary-*.zip
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      # One checksum file for every archive, so it can only be produced once all
      # four builds are in.
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
